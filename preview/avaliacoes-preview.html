<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FariLog — Prévia: notas e escala inteligente</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --brand:#FF4D0C; --brand-soft:#FFF7F4; --brand-line:#FFD9CC;
    --ink:#0B0B0B; --ink2:#4B5563; --muted:#9CA3AF;
    --line:#E5E7EB; --line2:#EFEFEF; --bg:#F4F4F5; --card:#fff;
    --soft:#F4F4F5; --soft2:#FAFAFA;
    --shadow:0 1px 2px rgba(0,0,0,.03), 0 12px 30px -20px rgba(0,0,0,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
  button,input,textarea{font-family:inherit}
  a{text-decoration:none;color:inherit}
  svg{display:block;flex-shrink:0}

  /* ── Layout ─────────────────────────────────────────────── */
  .layout{display:flex;min-height:100vh}
  .sidebar{
    width:224px;flex:0 0 224px;background:#0B0B0B;
    border-right:1px solid rgba(255,255,255,.06);
    display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:30;
  }
  .logo-wrap{height:96px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid rgba(255,255,255,.06);padding:14px 18px}
  .logo-wrap img{max-width:140px;max-height:54px;object-fit:contain}
  .logo-fallback{display:none;color:#fff;font-weight:900;letter-spacing:.16em;font-size:14px}
  .menu-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:#5A5A5A;text-transform:uppercase;padding:20px 20px 8px}
  .nav{padding:0 8px;display:flex;flex-direction:column;gap:3px}
  .nav-link{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:#8A8A8A;font-size:12.5px;font-weight:600;transition:.15s;cursor:pointer}
  .nav-link:hover{background:rgba(255,255,255,.05);color:#E5E5E5}
  .nav-link.active{background:#1A1A1A;color:#fff}
  .nav-link.disabled{opacity:.55;cursor:default}
  .nav-link .ico{width:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.06)}
  .user-mini{display:flex;align-items:center;gap:10px;padding:8px 10px 12px}
  .user-mini .avatar-sm{width:34px;height:34px;border-radius:50%;background:#1A1A1A;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:1px solid rgba(255,255,255,.12);flex-shrink:0}
  .user-mini b{display:block;font-size:11.5px;font-weight:700;color:#F5F5F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .user-mini span{font-size:10px;color:#6B6B6B}
  .logout{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#8A8A8A;font-size:12px;background:none;border:none;cursor:pointer;width:100%}
  .logout:hover{background:rgba(255,255,255,.05);color:#E5E5E5}

  .main{flex:1;margin-left:224px;min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 28px}
  .topbar-title{font-size:15px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
  .topbar-actions{display:flex;align-items:center;gap:10px}
  .search{position:relative}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:240px;padding:9px 14px 9px 36px;border-radius:11px;border:1px solid transparent;background:var(--soft);font-size:12.5px;color:var(--ink);outline:none;transition:.15s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{background:#fff;border-color:var(--line);box-shadow:0 0 0 3px rgba(255,77,12,.07)}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);color:#6B7280;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
  .icon-btn .dot{position:absolute;top:8px;right:9px;width:5px;height:5px;border-radius:50%;background:var(--brand)}
  .avatar-top{width:34px;height:34px;border-radius:50%;background:#0B0B0B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0}
  .mobile-tabs{display:none}

  .content{padding:22px 28px 60px;max-width:1240px;width:100%;margin:0 auto}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#6B7280;margin-bottom:12px}
  .back:hover{color:var(--ink)}
  .page-sub{font-size:12px;color:#6B7280;line-height:1.6;margin-bottom:14px;max-width:820px}
  .preview-note{font-size:10.5px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.5}

  /* ── Componentes ────────────────────────────────────────── */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .card-head{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .card-head h2{font-size:16px;font-weight:800;letter-spacing:-.02em}
  .card-head p{font-size:11.5px;color:#6B7280;margin-top:2px;line-height:1.45}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--soft);color:#6B7280;white-space:nowrap}
  .pill.dark{background:#0B0B0B;color:#fff}
  .pill.brand{background:var(--brand-soft);color:#C2410C;border:1px solid var(--brand-line)}
  .pill.line{background:#fff;color:#6B7280;border:1px solid var(--line)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:10px;padding:9px 15px;font-size:11.5px;font-weight:800;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--brand);color:#fff;box-shadow:0 3px 12px rgba(255,77,12,.28)}
  .btn-primary:hover{background:#E03A00}
  .btn-dark{background:#0B0B0B;color:#fff}
  .btn-ghost{background:#fff;color:#111;border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--soft2)}
  .btn-soft{background:var(--brand-soft);color:#C2410C;border:1px solid var(--brand-line)}
  .btn-soft:hover{background:#FFF1EA}
  .btn-wa{background:#fff;color:#0B0B0B;border:1px solid var(--line);padding:6px 9px;font-size:10px}
  .btn-wa:hover{background:var(--soft)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

  /* Contexto / ranking */
  .context{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;background:var(--soft2);border-bottom:1px solid var(--line2)}
  .context .field{display:flex;flex-direction:column;gap:2px;min-width:0}
  .context .field span{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .context .field b{font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .context .spacer{flex:1}
  .context .city{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;color:#6B7280;background:#fff;border:1px solid var(--line);padding:5px 9px;border-radius:8px}
  .rank-info{display:flex;align-items:center;gap:9px;padding:14px 22px;border-bottom:1px solid var(--line2);background:#fff}
  .rank-info .ico{width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .rank-info b{font-size:12px;font-weight:800}
  .rank-info p{font-size:10.5px;color:#6B7280;margin-top:1px;line-height:1.45}
  .rank-flow{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
  .flow-step{font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--soft);color:#4B5563}
  .flow-arrow{font-size:10px;color:#D1D5DB;font-weight:900}

  .cand{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line2);cursor:pointer;transition:background .12s;border-left:3px solid transparent}
  .cand:hover{background:var(--soft2)}
  .cand.sel{background:var(--brand-soft);border-left-color:var(--brand)}
  .cand .pos{font-size:10px;font-weight:900;color:var(--muted);width:24px;text-align:center;flex-shrink:0}
  .check{width:20px;height:20px;border-radius:6px;border:1.5px solid #CBD5E1;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s}
  .cand.sel .check{background:#0B0B0B;border-color:#0B0B0B}
  .check svg{opacity:0;transform:scale(.7);transition:.12s}
  .cand.sel .check svg{opacity:1;transform:scale(1)}
  .avatar{width:39px;height:39px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
  .cand .who{flex:1;min-width:0}
  .cand .name-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cand .name{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cand .meta{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap;font-size:10px;color:#6B7280}
  .cand .meta b{color:#4B5563;font-weight:800}
  .cand .rating{text-align:center;flex-shrink:0;min-width:100px}
  .stars{display:inline-flex;align-items:center;gap:1px;line-height:1;color:var(--brand);font-size:11px;letter-spacing:-1px}
  .stars .off{color:#E5E7EB}
  .rating .num{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--ink)}
  .rating small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
  .cand .actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .cand .price{font-size:11px;font-weight:800;color:#4B5563;background:var(--soft);padding:4px 8px;border-radius:6px;white-space:nowrap}
  .sel-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--soft2);border-top:1px solid var(--line)}
  .sel-foot b{font-size:12px;font-weight:800}
  .sel-foot span{font-size:10px;color:var(--muted)}

  /* Notas */
  .progress-box{padding:14px 22px;background:var(--soft2);border-bottom:1px solid var(--line2)}
  .progress-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .progress-top b{font-size:10px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)}
  .progress-top span{font-size:10px;color:var(--muted)}
  .bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--brand);transition:width .25s}
  .nota-row{padding:14px 22px;border-bottom:1px solid var(--line2)}
  .nota-row:last-child{border-bottom:none}
  .nota-main{display:flex;align-items:center;gap:11px}
  .nota-main .who{flex:1;min-width:0}
  .nota-main .name-line{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .nota-main .name{font-size:13px;font-weight:800}
  .nota-main .sub{font-size:10px;color:var(--muted);margin-top:1px}
  .star-picker{display:flex;align-items:center;gap:2px;flex-shrink:0}
  .star-picker button{background:none;border:none;padding:1px;cursor:pointer;font-size:22px;line-height:1;color:#D1D5DB;transition:.1s}
  .star-picker button.on{color:var(--brand)}
  .star-picker button:hover{transform:scale(1.12)}
  .star-picker .zero{margin-left:5px;font-size:9px;font-weight:900;padding:3px 6px;border-radius:5px;background:var(--soft);color:#6B7280;font-family:inherit;border:1px solid var(--line)}
  .star-picker .zero.on{background:#0B0B0B;color:#fff;border-color:#0B0B0B}
  .nota-val{font-size:12px;font-weight:900;color:var(--ink);margin-left:5px;min-width:20px;text-align:center}
  .obs-wrap{margin:9px 0 0 50px}
  .obs-label{display:flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .obs{width:100%;resize:vertical;min-height:46px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--soft2);font-size:11px;color:#374151;line-height:1.5;outline:none}
  .obs:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(255,77,12,.08)}
  .nota-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:var(--soft2);border-top:1px solid var(--line);flex-wrap:wrap}
  .nota-foot small{font-size:10px;color:var(--muted);line-height:1.45;max-width:420px}
  .nota-foot small b{color:#4B5563}

  /* Perfil */
  .profile-head{display:flex;align-items:center;gap:15px;padding:20px 22px;border-bottom:1px solid var(--line2);background:var(--soft2)}
  .profile-head .avatar{width:60px;height:60px;border-radius:17px;font-size:17px}
  .profile-head h2{font-size:19px;font-weight:900;letter-spacing:-.03em}
  .profile-head .sub{display:flex;align-items:center;gap:9px;margin-top:3px;flex-wrap:wrap;font-size:11px;color:#6B7280}
  .profile-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .stat-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:18px 22px 6px}
  .stat{border-radius:14px;padding:14px;background:var(--soft2);border:1px solid var(--line)}
  .stat.hot{background:var(--brand-soft);border-color:var(--brand-line)}
  .stat .lbl{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .stat .big{font-size:31px;font-weight:900;line-height:1;margin-top:3px;letter-spacing:-.04em;color:var(--ink)}
  .stat .big small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0}
  .stat .cap{font-size:10px;color:var(--muted);margin-top:5px}
  .profile-cols{display:grid;grid-template-columns:310px 1fr;gap:18px;padding:14px 22px 22px}
  .panel{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:14px}
  .panel h3{font-size:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;margin-bottom:10px}
  .dist-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .dist-row .lbl{font-size:10px;font-weight:800;color:#6B7280;width:30px}
  .dist-row .track{flex:1;height:7px;border-radius:99px;background:var(--soft);overflow:hidden}
  .dist-row .track i{display:block;height:100%;border-radius:99px}
  .dist-row .qty{font-size:10px;font-weight:800;color:var(--muted);width:18px;text-align:right}
  .hist-item{padding:11px 0;border-bottom:1px solid var(--line2)}
  .hist-item:last-child{border-bottom:none;padding-bottom:0}
  .hist-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .hist-company{font-size:12.5px;font-weight:800}
  .hist-meta{display:flex;align-items:center;gap:7px;margin-top:2px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
  .hist-right{text-align:right;flex-shrink:0}
  .hist-right .stars{font-size:10px}
  .hist-right .num{font-size:11px;font-weight:900;color:var(--ink)}
  .hist-right small{display:block;font-size:9px;color:var(--muted);margin-top:2px}
  .hist-obs{margin-top:7px;padding:8px 10px;border-radius:8px;background:var(--soft2);border:1px solid var(--line2);font-size:10.5px;color:#4B5563;line-height:1.5;display:flex;gap:6px}
  .hist-obs .quote{color:#D1D5DB;font-weight:900}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#0B0B0B;color:#fff;font-size:12px;font-weight:700;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.3)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:900px){
    .sidebar{display:none}
    .main{margin-left:0}
    .mobile-tabs{display:flex;gap:5px;padding:0 14px 10px;overflow:auto}
    .mtab{padding:7px 12px;border-radius:8px;background:var(--soft);color:#6B7280;font-size:11.5px;font-weight:700;white-space:nowrap}
    .mtab.active{background:#0B0B0B;color:#fff}
    .search input{width:160px}
    .rank-flow{display:none}
    .content{padding:18px 16px 50px}
    .profile-cols{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .topbar-in{padding:12px 14px;gap:8px}
    .topbar-title{font-size:14px}
    .search{display:none}
    .icon-btn{width:34px;height:34px}
    .cand{
      display:grid;
      grid-template-columns:20px 39px minmax(0,1fr) auto;
      grid-template-areas:
        "check avatar who who"
        ". . rating actions";
      column-gap:10px;row-gap:7px;align-items:center;
      padding:12px 14px;
    }
    .cand .pos,.cand .price{display:none}
    .cand .check{grid-area:check}
    .cand .avatar{grid-area:avatar}
    .cand .who{grid-area:who;min-width:0}
    .cand .name{white-space:normal}
    .cand .rating{grid-area:rating;min-width:0;text-align:left;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .cand .rating small{display:inline;margin-top:0}
    .cand .actions{grid-area:actions;justify-self:end}
    .nota-row{padding:13px 14px}
    .obs-wrap{margin-left:0}
    .nota-main{flex-wrap:wrap}
    .star-picker{width:100%;justify-content:flex-end}
    .nota-foot{align-items:flex-start}
    .profile-head{flex-wrap:wrap}
    .profile-head .right{margin-left:0;width:100%}
    .stat-grid{grid-template-columns:1fr}
    .stat.hot{grid-column:auto}
  }
</style>
</head>
<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-wrap">
      <img src="https://ik.imagekit.io/xsbrdnr0y/Logo%20Farilog%20branco%20(sem%20fundo).png" alt="FariLog"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block'" />
      <span class="logo-fallback">FariLog</span>
    </div>
    <div class="menu-label">Menu</div>
    <nav class="nav">
      <a class="nav-link disabled" href="#" onclick="return false;">
        <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
        Visão Geral
      </a>
      <a class="nav-link" data-view="sugestao" href="?view=sugestao">
        <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="9" x2="21" y2="9"/></svg></span>
        Escalas
      </a>
      <a class="nav-link" data-view="notas" href="?view=notas">
        <span class="ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg></span>
        Histórico
      </a>
      <a class="nav-link" data-view="perfil" href="?view=perfil">

<div class="toast" id="toast"></div>

<script>
  // ── Dados de demonstração ──────────────────────────────────────────────
  const CANDIDATES = [
    { name:'Gabriel Santos',   initials:'GS', color:'#0B0B0B', city:'Gravataí/RS',      prox:0, media:4.9, total:18, rate:150, cargo:'Ajudante de Logística', phone:'51997099406' },
    { name:'Rafael Lima',      initials:'RL', color:'#1F2937', city:'Gravataí/RS',      prox:0, media:4.6, total:12, rate:150, cargo:'Ajudante de Logística', phone:'51984442211' },

    { name:'Carlos Mendes',    initials:'CM', color:'#4B5563', city:'Porto Alegre/RS',  prox:1, media:3.9, total:7,  rate:150, cargo:'Conferente',            phone:'51998761234' },
    { name:'Ana Paula Souza',  initials:'AP', color:'#6B7280', city:'Canoas/RS',        prox:1, media:3.4, total:4,  rate:145, cargo:'Ajudante de Logística', phone:'51993214455' },
    { name:'Diego Ferreira',   initials:'DF', color:'#111827', city:'Florianópolis/SC', prox:2, media:4.2, total:3,  rate:150, cargo:'Ajudante de Logística', phone:'51982110077' },
    { name:'Bruna Alves',      initials:'BA', color:'#9CA3AF', city:'—',                prox:3, media:null, total:0, rate:150, cargo:'Ajudante de Logística', phone:'51995553322' },
  ];

  const NOTAS = [
    { name:'Gabriel Santos', initials:'GS', color:'#0B0B0B', status:'Finalizado', nota:5, obs:'Pontual, organizado e ajudou no fechamento da carga.' },
    { name:'Rafael Lima',    initials:'RL', color:'#1F2937', status:'Finalizado', nota:4, obs:'Bom ritmo de trabalho; chegou 10 minutos atrasado.' },
    { name:'Juliana Rocha',  initials:'JR', color:'#374151', status:'Finalizado', nota:5, obs:'Excelente atendimento ao cliente e proatividade.' },
    { name:'Carlos Mendes',  initials:'CM', color:'#4B5563', status:'Finalizado', nota:3, obs:'Faltou atenção na conferência dos volumes.' },
  ];

  const HISTORICO = [
    { date:'sex, 15/11/2026', company:'TransLog Distribuição', type:'Entrega', nota:5, by:'Carlos Líder', obs:'Pontual, organizado e ajudou no fechamento da carga.' },
    { date:'qua, 13/11/2026', company:'Mercado Sul Atacado',   type:'Entrega', nota:5, by:'Carlos Líder', obs:'Muito atento ao cliente e ao checklist de saída.' },
    { date:'seg, 11/11/2026', company:'AgroVale Insumos',      type:'Carga/Descarga', nota:4, by:'Juliana Rocha', obs:'Bom desempenho; precisa cuidar melhor do tempo de intervalo.' },
    { date:'sex, 08/11/2026', company:'TransLog Distribuição', type:'Entrega', nota:5, by:'Carlos Líder', obs:'Referência de organização para a equipe.' },
    { date:'qua, 06/11/2026', company:'Mercado Sul Atacado',   type:'Entrega', nota:4, by:'Carlos Líder', obs:'Cumpriu a rota sem ocorrências.' },
    { date:'seg, 04/11/2026', company:'TransLog Distribuição', type:'Carga/Descarga', nota:3, by:'Juliana Rocha', obs:'Precisa melhorar a conferência de carretas.' },
  ];

  const PROX = {
    0: { label:'Mesma cidade', cls:'dark' },
    1: { label:'Mesma UF', cls:'' },
    2: { label:'Outra cidade', cls:'line' },
    3: { label:'Cidade não informada', cls:'brand' },
  };

  const fmtNota = (n) => n == null ? '—' : Number(n).toFixed(1).replace('.', ',');
  const starsHTML = (nota, size) => {
    const full = Math.round(Number(nota) || 0);
    let out = '<span class="stars" style="font-size:' + (size || 11) + 'px">';
    for (let i = 1; i <= 5; i++) out += '<span class="' + (i <= full ? '' : 'off') + '">★</span>';
    return out + '</span>';
  };
  const wa = (phone, msg) => {
    let d = String(phone || '').replace(/\D/g, '');
    if (!d.startsWith('55')) d = '55' + d;
    return 'https://wa.me/' + d + (msg ? '?text=' + encodeURIComponent(msg) : '');
  };
  const waIcon = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.122 1.532 5.855L.057 23.884a.5.5 0 0 0 .606.634l6.193-1.623A11.945 11.945 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22a9.944 9.944 0 0 1-5.127-1.415l-.368-.218-3.812 1 1.02-3.718-.24-.382A9.944 9.944 0 0 1 2 12C2 6.478 6.478 2 12 2s10 4.478 10 10-4.478 10-10 10z"/></svg>';

  // ── View: Sugestão ─────────────────────────────────────────────────────
  function viewSugestao() {
    document.getElementById('page-title').textContent = 'Escalas';
    document.getElementById('page-sub').innerHTML = 'O encarregado escolhe a empresa e a data, clica em <b>“Sugerir ajudantes”</b> e recebe os candidatos próximos ordenados pela nota média, com contato direto no WhatsApp.';
    const rows = CANDIDATES.map((c, i) => {
      const prox = PROX[c.prox];
      const rating = c.media == null
        ? '<span class="pill">Sem nota</span>'
        : '<div class="num">' + starsHTML(c.media, 10) + ' ' + fmtNota(c.media) + '</div><small>' + c.total + ' avaliações</small>';
      return '<div class="cand" data-cand>' +
        '<span class="pos">' + (i + 1) + 'º</span>' +
        '<span class="check"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
        '<div class="avatar" style="background:' + c.color + '">' + c.initials + '</div>' +
        '<div class="who">' +
          '<div class="name-line"><span class="name">' + c.name + '</span>' +
            '<span class="pill ' + prox.cls + '">' + prox.label + '</span>' +
            (i === 0 ? '<span class="pill brand">Melhor nota</span>' : '') +
          '</div>' +
          '<div class="meta"><span>📍 ' + c.city + '</span><span>· ' + c.cargo + '</span><b>R$ ' + c.rate + '/dia</b></div>' +
        '</div>' +
        '<div class="rating">' + rating + '</div>' +
        '<div class="actions">' +
          '<a class="btn btn-wa" href="' + wa(c.phone, 'Olá ' + c.name.split(' ')[0] + ', tudo bem? Aqui é da FariLog. Temos uma diária em TransLog Distribuição no dia sex, 15/11/2026. Podemos contar com você?') + '" target="_blank" rel="noopener">' + waIcon + ' Contato</a>' +
        '</div>' +
      '</div>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<section class="card">' +
        '<div class="context">' +
          '<div class="field"><span>Empresa</span><b>TransLog Distribuição</b></div>' +
          '<div class="field"><span>Data do serviço</span><b>sex, 15/11/2026</b></div>' +
          '<div class="field"><span>Modalidade</span><b>Entrega · 07:30</b></div>' +
          '<span class="city">📍 Gravataí/RS</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn btn-soft" onclick="showToast(\'Ranking recalculado: proximidade → nota média.\')">✨ Sugerir ajudantes</button>' +
        '</div>' +
        '<div class="rank-info">' +
          '<div class="ico">✨</div>' +
          '<div><b>Ranking inteligente de candidatos</b><p>Quem já está escalado neste dia não aparece. A lista prioriza a cidade da empresa e depois a média de notas.</p></div>' +
          '<div class="rank-flow">' +
            '<span class="flow-step">📍 Proximidade</span><span class="flow-arrow">→</span>' +
            '<span class="flow-step">⭐ Nota média</span><span class="flow-arrow">→</span>' +
            '<span class="flow-step">💬 WhatsApp</span>' +
          '</div>' +
        '</div>' +
        rows +
        '<div class="sel-foot">' +
          '<div><b><span id="sel-count">0</span> selecionado(s)</b><br><span>7 candidatos próximos · 4 já escalados hoje</span></div>' +
          '<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="showToast(\'Seleção limpa.\')">Limpar</button>' +
          '<button class="btn btn-primary" onclick="showToast(\'Ajudantes adicionados à equipe da escala.\')">Adicionar à equipe</button></div>' +
        '</div>' +
      '</section>';

    document.querySelectorAll('[data-cand]').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        row.classList.toggle('sel');
        updateSelCount();
      });
    });
  }

  function updateSelCount() {
    const n = document.querySelectorAll('[data-cand].sel').length;
    const el = document.getElementById('sel-count');
    if (el) el.textContent = n;
  }

  // ── View: Notas da diária ──────────────────────────────────────────────
  function viewNotas() {
    document.getElementById('page-title').textContent = 'Notas da diária';
    document.getElementById('page-sub').innerHTML = 'Ao fechar a diária, o encarregado atribui uma nota de <b>0 a 5</b> e uma observação para cada ajudante. Cada nota atualiza automaticamente a média do profissional.';
    const rows = NOTAS.map((n, idx) => {
      const nota = n.nota == null ? null : n.nota;
      let picker = '<div class="star-picker" data-stars data-row data-nota="' + (nota == null ? '' : nota) + '">';
      for (let i = 1; i <= 5; i++) picker += '<button type="button" data-val="' + i + '" class="' + (nota != null && i <= nota ? 'on' : '') + '">★</button>';
      picker += '<button type="button" data-val="0" class="zero ' + (nota === 0 ? 'on' : '') + '">0</button>';
      picker += '<span class="nota-val">' + (nota == null ? '—' : fmtNota(nota)) + '</span></div>';
      return '<div class="nota-row" data-row data-nota="' + (nota == null ? '' : nota) + '">' +
        '<div class="nota-main">' +
          '<div class="avatar" style="background:' + n.color + '">' + n.initials + '</div>' +
          '<div class="who"><div class="name-line"><span class="name">' + n.name + '</span><span class="pill">' + n.status + '</span></div>' +
            '<div class="sub">Diária: R$ 150 · TransLog Distribuição</div></div>' +
          picker +
        '</div>' +
        '<div class="obs-wrap"><div class="obs-label">💬 Observação</div>' +
          '<textarea class="obs" rows="2" placeholder="Ex.: pontual, organizado, bom atendimento ao cliente...">' + (n.obs || '') + '</textarea>' +
        '</div>' +
      '</div>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<section class="card">' +
        '<div class="card-head">' +
          '<div><div style="display:flex;align-items:center;gap:7px"><span class="pill dark">⭐ Notas da diária</span><span style="font-size:10px;color:#9CA3AF;font-weight:600">sex, 15/11/2026</span></div>' +
          '<h2 style="margin-top:5px">TransLog Distribuição</h2><p>Entrega · 4 ajudantes escalados · notas de 0 a 5</p></div>' +
          '<span class="pill line">Histórico do ajudante</span>' +
        '</div>' +
        '<div class="progress-box">' +
          '<div class="progress-top"><b id="notas-progress-label">4 de 4 avaliados</b><span id="notas-progress-pct">100%</span></div>' +
          '<div class="bar"><i id="notas-progress-bar" style="width:100%"></i></div>' +
        '</div>' +
        rows +
        '<div class="nota-foot">' +
          '<small>Notas de <b>0 a 5</b>. A média do ajudante é recalculada automaticamente e aparece no perfil dele com <b>dia, empresa e observação</b>.</small>' +
          '<div style="display:flex;gap:8px"><button class="btn btn-ghost" onclick="showToast(\'Edição cancelada nesta prévia.\')">Cancelar</button>' +
          '<button class="btn btn-primary" onclick="showToast(\'Notas salvas. Médias dos ajudantes atualizadas.\')">⭐ Salvar notas</button></div>' +
        '</div>' +
      '</section>';

    document.querySelectorAll('.star-picker').forEach(picker => {
      picker.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = Number(btn.dataset.val);
          const row = picker.closest('.nota-row');
          row.dataset.nota = String(val);
          picker.dataset.nota = String(val);
          picker.querySelectorAll('button').forEach(b => {
            const bv = Number(b.dataset.val);
            b.classList.toggle('on', val > 0 ? (bv > 0 && bv <= val) : bv === 0);
          });
          picker.querySelector('.nota-val').textContent = fmtNota(val);
          updateNotasProgress();
        });
      });
    });
    updateNotasProgress();
  }

  function updateNotasProgress() {
    const rows = [...document.querySelectorAll('.nota-row')];
    const done = rows.filter(r => r.dataset.nota !== '' && r.dataset.nota !== undefined).length;
    const pct = rows.length ? Math.round((done / rows.length) * 100) : 0;
    const label = document.getElementById('notas-progress-label');
    const pctEl = document.getElementById('notas-progress-pct');
    const bar = document.getElementById('notas-progress-bar');
    if (label) label.textContent = done + ' de ' + rows.length + ' avaliados';
    if (pctEl) pctEl.textContent = pct + '%';
    if (bar) bar.style.width = pct + '%';
  }

  // ── View: Perfil ───────────────────────────────────────────────────────
  function viewPerfil() {
    document.getElementById('page-title').textContent = 'Ajudantes';
    document.getElementById('page-sub').innerHTML = 'Ao abrir o perfil, o encarregado vê a média, a distribuição das notas e o histórico completo com <b>dia, empresa, nota e observação</b> de cada diária.';
    const hist = HISTORICO.map(h =>
      '<div class="hist-item">' +
        '<div class="hist-top">' +
          '<div><div class="hist-company">' + h.company + '</div>' +
            '<div class="hist-meta"><span>📅 ' + h.date + '</span><span class="pill ' + (h.type === 'Entrega' ? '' : 'line') + '">' + h.type + '</span></div>' +
          '</div>' +
          '<div class="hist-right"><div>' + starsHTML(h.nota, 10) + ' <span class="num">' + fmtNota(h.nota) + '</span></div><small>por ' + h.by + '</small></div>' +
        '</div>' +
        '<div class="hist-obs"><span class="quote">“</span><span>' + h.obs + '</span></div>' +
      '</div>'
    ).join('');

    const dist = [
      { n:5, q:12, color:'#FF4D0C' }, { n:4, q:4, color:'#0B0B0B' },
      { n:3, q:2, color:'#6B7280' },  { n:2, q:0, color:'#9CA3AF' },
      { n:1, q:0, color:'#D1D5DB' },  { n:0, q:0, color:'#E5E7EB' },
    ];
    const maxQ = Math.max(1, ...dist.map(d => d.q));
    const distHTML = dist.map(d =>
      '<div class="dist-row"><span class="lbl">' + d.n + ' ★</span>' +
        '<span class="track"><i style="width:' + ((d.q / maxQ) * 100) + '%;background:' + d.color + '"></i></span>' +
        '<span class="qty">' + d.q + '</span></div>'
    ).join('');

    document.getElementById('app').innerHTML =
      '<section class="card">' +
        '<div class="profile-head">' +
          '<div class="avatar" style="background:#0B0B0B">GS</div>' +
          '<div><h2>Gabriel Santos</h2><div class="sub"><span>Ajudante de Logística</span><span>· 📍 Cachoeirinha</span><span>· 📞 (51) 99709-9406</span></div></div>' +
          '<div class="right"><a class="btn btn-wa" style="padding:8px 12px" href="' + wa('51997099406', 'Olá Gabriel, tudo bem? Aqui é da FariLog.') + '" target="_blank" rel="noopener">' + waIcon + ' WhatsApp</a>' +
          '<button class="btn btn-ghost">✕</button></div>' +
        '</div>' +
        '<div class="stat-grid">' +
          '<div class="stat hot"><div class="lbl">Média geral</div><div class="big">4,8 <small>/ 5</small></div><div style="margin-top:7px">' + starsHTML(4.8, 14) + '</div></div>' +
          '<div class="stat"><div class="lbl">Avaliações</div><div class="big">18</div><div class="cap">diárias avaliadas</div></div>' +
          '<div class="stat"><div class="lbl">Última nota</div><div class="big">5,0</div><div class="cap">sex, 15/11/2026</div></div>' +
        '</div>' +
        '<div class="profile-cols">' +
          '<div class="panel"><h3>Distribuição das notas</h3>' + distHTML + '</div>' +
          '<div class="panel"><h3>Histórico de notas e observações</h3>' + hist + '</div>' +
        '</div>' +
      '</section>';
  }

  // ── Toast + roteamento ─────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  const VIEWS = { sugestao: viewSugestao, notas: viewNotas, perfil: viewPerfil };
  const view = new URLSearchParams(location.search).get('view') || 'sugestao';
  (VIEWS[view] || viewSugestao)();
  document.querySelectorAll('.nav-link[data-view], .mtab[data-view]').forEach(t => {
    t.classList.toggle('active', t.dataset.view === view);
  });
</script>
